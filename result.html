<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Check your Verchas Academy Test results. Enter your registered mobile number to view your marks and performance analysis.">
  <title>Test Results | Verchas Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://verchasacademy.in/result.html">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #004aad;
      margin-bottom: 25px;
    }

    input {
      align-items: center;
      padding: 14px;
      font-size: 1em;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 80%;
      max-width: 250px;
      display: block;
      margin: 0 auto 15px auto;
      text-align: center;
      letter-spacing: 1px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #004aad;
      color: #fff;
      font-size: 1.05em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #003080;
    }

    .home-btn {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background: #ffcc00;
      color: #004aad;
      font-weight: 800;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 5px 14px rgba(0,0,0,0.18);
    }

    .home-btn:hover {
      background: #004aad;
      color: #fff;
    }

    .result {
      margin-top: 20px;
      font-size: 1.05em;
      font-weight: 600;
    }

    .error {
      color: #e53935;
    }

    .success {
      color: #2e7d32;
    }

    .rank-message {
      margin: 12px 0 14px;
      padding: 12px 10px;
      border: 1px solid #f2c94c;
      border-radius: 8px;
      background: linear-gradient(135deg, #fff8db, #fff0b3);
      color: #805600;
      font-size: 1em;
      line-height: 1.5;
      font-weight: 700;
      box-shadow: 0 3px 9px rgba(128, 86, 0, 0.10);
    }

    .rank-message .rank-icon {
      display: block;
      font-size: 1.45em;
      margin-bottom: 3px;
    }
    .logo {
      max-width: 120px;
      margin-bottom: 4px;
    }
    .academy-name{
      font-size: 2.1em;
      color: #004aad;
      margin: 2px 0 4px 0;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .page-title{
      font-size: 1.8em;
      color: #333;
      margin-bottom: 22px;
      font-weight: 700;
    }

    /* 🔄 Loading Spinner */
    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #004aad;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 18px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .note-box {
      margin-top: 10px;
      padding: 12px;
      background: #fff3cd;
      border-left: 5px solid #ff9800;
      border-radius: 6px;
      font-size: 0.9em;
      line-height: 1.6;
      text-align: justify;
    }

    /* ===== MARKS TABLE STYLING ===== */
    .marks-table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
      font-size: 0.95em;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    .marks-table th {
      background-color: #004aad;
      color: #ffffff;
      padding: 12px;
      text-align: left;
    }

    .marks-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
      color: #333;
      text-align: left;
    }

    .marks-table tr:last-child td {
      border-bottom: none;
    }

    .marks-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* ⭐ UPDATED TOTAL ROW STYLING */
    .total-row {
      background-color: #e8f5e9 !important; 
      font-weight: 900;
      color: #2e7d32; 
      font-size: 1.2em; 
    }
  
    /* Ranker celebration: lightweight CSS-only balloons and confetti */
    .celebration-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      pointer-events: none;
    }
    .celebration-balloon {
      position: absolute;
      bottom: -130px;
      width: 38px;
      height: 50px;
      border-radius: 50% 50% 46% 46%;
      opacity: 0.92;
      box-shadow: inset -7px -6px 0 rgba(0,0,0,0.10);
      animation: balloon-rise var(--duration, 4.8s) ease-in forwards;
    }
    .celebration-balloon::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 0;
      border-top: 9px solid var(--balloon-color);
    }
    .celebration-balloon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 56px;
      width: 1px;
      height: 48px;
      background: rgba(80,80,80,0.45);
      transform: rotate(4deg);
      transform-origin: top;
    }
    @keyframes balloon-rise {
      0% { transform: translate3d(0, 0, 0) rotate(-7deg); opacity: 0; }
      10% { opacity: .95; }
      50% { transform: translate3d(18px, -55vh, 0) rotate(8deg); }
      100% { transform: translate3d(-12px, -115vh, 0) rotate(-5deg); opacity: .9; }
    }
    .celebration-confetti {
      position: absolute;
      top: -18px;
      width: 9px;
      height: 14px;
      opacity: .95;
      animation: confetti-fall var(--duration, 4s) linear forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translate3d(0, -5vh, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate3d(var(--drift, 30px), 110vh, 0) rotate(var(--spin, 720deg)); opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .celebration-balloon, .celebration-confetti { animation-duration: 1ms !important; }
    }

  </style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Examination Results Portal - Verchas Academy",
  "description": "Official online portal for students and parents to review periodic minor tests, major test scores, and mock performance evaluations at Verchas Academy.",
  "publisher": {
    "@type": "EducationalOrganization",
    "name": "Verchas Academy",
    "url": "https://verchasacademy.in/"
  }
}
</script>
</head>

<body>

  <div class="container">
    <img src="verchas-logo.webp" alt="Verchas Academy Logo" class="logo">
    <h1 class="academy-name">Verchas Academy</h1>
    <h2 class="page-title" id="pageTitle">Test Result</h2>

    <input
      type="text"
      id="mobile"
      placeholder="Registered Mobile Number"
      maxlength="10"
    >

    <button id="viewResultBtn" onclick="getResult()">View Result</button>

    <div id="result" class="result"></div>
    <a href="index.html" id="homeBtn" class="home-btn">Home</a>
  </div>

  <script>
const API_URL = "https://vera.runasp.net/api/results";

const params = new URLSearchParams(window.location.search);

// 1. Grab the exact sheet name directly from the URL (defaults to "Misc")
const sheetName = params.get("sheet") || "Misc";

// 2. Automatically generate the Page Title based on the sheet name
const displayTitle = sheetName === "Misc" ? "Miscellaneous Result" : sheetName + " Result";
document.getElementById("pageTitle").textContent = displayTitle;

const returnPage = params.get("lang") === "hi" ? "hindi.html" : "index.html";
document.getElementById("homeBtn").href = returnPage;


function launchRankCelebration() {
  // Remove any previous animation before starting a fresh one.
  document.querySelector(".celebration-layer")?.remove();

  const layer = document.createElement("div");
  layer.className = "celebration-layer";
  layer.setAttribute("aria-hidden", "true");
  document.body.appendChild(layer);

  const balloonColors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0", "#9b5de5", "#ff922b"];
  for (let i = 0; i < 15; i++) {
    const balloon = document.createElement("span");
    balloon.className = "celebration-balloon";
    const color = balloonColors[i % balloonColors.length];
    balloon.style.left = (3 + Math.random() * 94) + "%";
    balloon.style.setProperty("--balloon-color", color);
    balloon.style.background = color;
    balloon.style.setProperty("--duration", (4.2 + Math.random() * 1.4) + "s");
    balloon.style.animationDelay = (Math.random() * 0.65) + "s";
    layer.appendChild(balloon);
  }

  const confettiColors = ["#ff4d6d", "#ffd166", "#06d6a0", "#4cc9f0", "#9b5de5", "#ff922b"];
  for (let i = 0; i < 95; i++) {
    const piece = document.createElement("span");
    piece.className = "celebration-confetti";
    piece.style.left = (Math.random() * 100) + "%";
    piece.style.background = confettiColors[i % confettiColors.length];
    piece.style.setProperty("--duration", (3.2 + Math.random() * 2.0) + "s");
    piece.style.setProperty("--drift", ((Math.random() - 0.5) * 220) + "px");
    piece.style.setProperty("--spin", (360 + Math.random() * 1080) + "deg");
    piece.style.animationDelay = (Math.random() * 0.8) + "s";
    if (Math.random() > 0.55) {
      piece.style.width = "6px";
      piece.style.height = "6px";
      piece.style.borderRadius = "50%";
    }
    layer.appendChild(piece);
  }

  window.setTimeout(() => layer.remove(), 6500);
}

function getResult() {
  const mobile = document.getElementById("mobile").value.trim();
  const resultDiv = document.getElementById("result");

  resultDiv.innerHTML = "";

  if (mobile.length !== 10) {
    resultDiv.innerHTML = "<span class='error'>Please enter a valid 10-digit mobile number</span>";
    return;
  }

  // Show loading spinner
  resultDiv.innerHTML = "<div class='loader'></div><div style='color: #004aad;'>Fetching result…</div>";

  // 3. Request the selected test result from the VeraERP Results API
  const fetchUrl = API_URL + "?sheetName=" + encodeURIComponent(sheetName) + "&mobile=" + encodeURIComponent(mobile);

  fetch(fetchUrl, { method: "GET", headers: { "Accept": "application/json" } })
    .then(async res => {
      const data = await res.json();
      if (!res.ok || data.error) throw new Error("NO_RESULT");
      return data;
    })
    .then(data => {
        const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
        }[ch]));
        let rawMarks = String(data.marks ?? "");
        let tableHTML = "";

        if (rawMarks.includes('(') && rawMarks.includes(')')) {
          let parts = rawMarks.split('(');
          let totalScore = parts[0].trim(); 
          let subjectString = parts[1].replace(')', '').trim(); 
          
          tableHTML = `<table class="marks-table">
                        <tr><th>Subject</th><th>Marks</th></tr>`;
          
          let subjects = subjectString.split(',');
          subjects.forEach(sub => {
            let match = sub.trim().match(/^(.*?)\s*-\s*(-?[\d.]+\/[\d.]+)$/);
            
            if (match) {
              let subName = match[1].trim(); 
              let marks = match[2].trim();   
              tableHTML += `<tr>
                              <td><b>${escapeHTML(subName)}</b></td>
                              <td>${escapeHTML(marks)}</td>
                            </tr>`;
            } else {
              let subParts = sub.trim().split('-');
              if (subParts.length >= 2) {
                let marks = subParts.pop().trim();
                let subName = subParts.join('-').trim();
                tableHTML += `<tr>
                                <td><b>${escapeHTML(subName)}</b></td>
                                <td>${escapeHTML(marks)}</td>
                              </tr>`;
              }
            }
          });

          tableHTML += `<tr class="total-row">
                          <td>Total</td>
                          <td>${escapeHTML(totalScore)}</td>
                        </tr>
                      </table>`;
        } else {
          // Check if the word is "ABSENT" and make it red
          if (rawMarks.trim().toUpperCase() === "ABSENT") {
            tableHTML = `<div style='margin-top: 15px; color: #d32f2f; font-size: 1.2em;'><b>ABSENT</b></div>`;
          } else {
            tableHTML = `<div style='margin-top: 15px;'><b>${escapeHTML(rawMarks)}</b></div>`;
          }
        }

        const rankLabels = { 1: "1st", 2: "2nd", 3: "3rd" };
        const rankMessage = rankLabels[data.rank]
          ? "<div class='rank-message'><span class='rank-icon'>🏆🎉</span>" +
            "Congratulations! You ranked <strong>" + rankLabels[data.rank] +
            "</strong> in your batch.</div>"
          : "";

        resultDiv.innerHTML =
          "<div class='success'>" +
          "<div style='font-size: 1.15em; margin-bottom: 5px; color: #004aad;'>Name: <span style='color: #333;'><b>" + escapeHTML(data.name) + "</b></span></div>" +
          (data.batch ? "<div style='font-size: 1em; margin-bottom: 8px; color: #004aad;'>Batch: <span style='color: #333;'><b>" + escapeHTML(data.batch) + "</b></span></div>" : "") +
          rankMessage +
          tableHTML +
          "</div>";

        // Once a result is successfully fetched, hide the search controls.
        document.getElementById("mobile").style.display = "none";
        document.getElementById("viewResultBtn").style.display = "none";

        const rank = Number(data.rank);
        if (Number.isInteger(rank) && rank >= 1 && rank <= 3) {
          launchRankCelebration();
        }
    })
    .catch(error => {
      if (error && error.message === "NO_RESULT") {
        resultDiv.innerHTML = "<span class='error'>No result found</span>";
      } else {
        resultDiv.innerHTML = "<span class='error'>Something went wrong. Please try again.</span>";
      }
    });
}
</script>
</body>
</html>
