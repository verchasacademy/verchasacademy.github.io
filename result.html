<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Check your Verchas Academy Test results. Enter your registered mobile number to view your marks and performance analysis.">
  <title>Test Results | Verchas Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://verchasacademy.in/result.html">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #004aad;
      margin-bottom: 25px;
    }

    input {
      align-items: center;
      padding: 14px;
      font-size: 1em;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 80%;
      max-width: 250px;
      display: block;
      margin: 0 auto 15px auto;
      text-align: center;
      letter-spacing: 1px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #004aad;
      color: #fff;
      font-size: 1.05em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #003080;
    }

    .home-btn {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 24px;
      background: #ffcc00;
      color: #004aad;
      font-weight: 800;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 5px 14px rgba(0,0,0,0.18);
    }

    .home-btn:hover {
      background: #004aad;
      color: #fff;
    }

    .result {
      margin-top: 20px;
      font-size: 1.05em;
      font-weight: 600;
    }

    .error {
      color: #e53935;
    }

    .success {
      color: #2e7d32;
    }
    .logo {
      max-width: 120px;
      margin-bottom: 4px;
    }
    .academy-name{
      font-size: 2.1em;
      color: #004aad;
      margin: 2px 0 4px 0;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .page-title{
      font-size: 1.8em;
      color: #333;
      margin-bottom: 22px;
      font-weight: 700;
    }

    /* 🔄 Loading Spinner */
    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #004aad;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 18px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .note-box {
      margin-top: 10px;
      padding: 12px;
      background: #fff3cd;
      border-left: 5px solid #ff9800;
      border-radius: 6px;
      font-size: 0.9em;
      line-height: 1.6;
      text-align: justify;
    }

    /* ===== MARKS TABLE STYLING ===== */
    .marks-table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
      font-size: 0.95em;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    .marks-table th {
      background-color: #004aad;
      color: #ffffff;
      padding: 12px;
      text-align: left;
    }

    .marks-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
      color: #333;
      text-align: left;
    }

    .marks-table tr:last-child td {
      border-bottom: none;
    }

    .marks-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* ⭐ UPDATED TOTAL ROW STYLING */
    .total-row {
      background-color: #e8f5e9 !important; 
      font-weight: 900;
      color: #2e7d32; 
      font-size: 1.2em; 
    }
  </style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Examination Results Portal - Verchas Academy",
  "description": "Official online portal for students and parents to review periodic minor tests, major test scores, and mock performance evaluations at Verchas Academy.",
  "publisher": {
    "@type": "EducationalOrganization",
    "name": "Verchas Academy",
    "url": "https://verchasacademy.in/"
  }
}
</script>
</head>

<body>

  <div class="container">
    <img src="verchas-logo.webp" alt="Verchas Academy Logo" class="logo">
    <h1 class="academy-name">Verchas Academy</h1>
    <h2 class="page-title" id="pageTitle">Test Result</h2>

    <input
      type="text"
      id="mobile"
      placeholder="Registered Mobile Number"
      maxlength="10"
    >

    <button onclick="getResult()">View Result</button>

    <div id="result" class="result"></div>
    <a href="index.html" id="homeBtn" class="home-btn">Home</a>
  </div>

  <script>
const API_URL = "https://script.google.com/macros/s/AKfycbxffhVZm_nctVZJ09YlUx3FwQlq7eozkOJmr7wGFWrA5c1ZHawX85dUSMMiQJboZ00AFg/exec";

const params = new URLSearchParams(window.location.search);

// 1. Grab the exact sheet name directly from the URL (defaults to "Misc")
const sheetName = params.get("sheet") || "Misc";

// 2. Automatically generate the Page Title based on the sheet name
const displayTitle = sheetName === "Misc" ? "Miscellaneous Result" : sheetName + " Result";
document.getElementById("pageTitle").textContent = displayTitle;

const returnPage = params.get("lang") === "hi" ? "hindi.html" : "index.html";
document.getElementById("homeBtn").href = returnPage;

function getResult() {
  const mobile = document.getElementById("mobile").value.trim();
  const resultDiv = document.getElementById("result");

  resultDiv.innerHTML = "";

  if (mobile.length !== 10) {
    resultDiv.innerHTML = "<span class='error'>Please enter a valid 10-digit mobile number</span>";
    return;
  }

  // Show loading spinner
  resultDiv.innerHTML = "<div class='loader'></div><div style='color: #004aad;'>Fetching result…</div>";

  // 3. Send the exact sheetName straight to your future-proof Google Script
  const fetchUrl = API_URL + "?sheetName=" + encodeURIComponent(sheetName) + "&mobile=" + encodeURIComponent(mobile);

  fetch(fetchUrl)
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        resultDiv.innerHTML = "<span class='error'>No result found</span>";
      } else {
        let rawMarks = data.marks; 
        let tableHTML = "";

        if (rawMarks.includes('(') && rawMarks.includes(')')) {
          let parts = rawMarks.split('(');
          let totalScore = parts[0].trim(); 
          let subjectString = parts[1].replace(')', '').trim(); 
          
          tableHTML = `<table class="marks-table">
                        <tr><th>Subject</th><th>Marks</th></tr>`;
          
          let subjects = subjectString.split(',');
          subjects.forEach(sub => {
            let match = sub.trim().match(/^(.*?)\s*-\s*(-?[\d.]+\/[\d.]+)$/);
            
            if (match) {
              let subName = match[1].trim(); 
              let marks = match[2].trim();   
              tableHTML += `<tr>
                              <td><b>${subName}</b></td>
                              <td>${marks}</td>
                            </tr>`;
            } else {
              let subParts = sub.trim().split('-');
              if (subParts.length >= 2) {
                let marks = subParts.pop().trim();
                let subName = subParts.join('-').trim();
                tableHTML += `<tr>
                                <td><b>${subName}</b></td>
                                <td>${marks}</td>
                              </tr>`;
              }
            }
          });

          tableHTML += `<tr class="total-row">
                          <td>Total</td>
                          <td>${totalScore}</td>
                        </tr>
                      </table>`;
        } else {
          tableHTML = `<div style='margin-top: 15px;'><b>${rawMarks}</b></div>`;
        }

        resultDiv.innerHTML = 
          "<div class='success'>" +
          "<div style='font-size: 1.15em; margin-bottom: 5px; color: #004aad;'>Name: <span style='color: #333;'><b>" + data.name + "</b></span></div>" +
          tableHTML +
          "</div>";
      }
    })
    .catch(() => {
      resultDiv.innerHTML = "<span class='error'>Something went wrong. Please try again.</span>";
    });
}
</script>
</body>
</html>
